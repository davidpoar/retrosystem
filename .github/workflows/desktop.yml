name: Build Desktop

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build spectrum (desktop)
        run: dotnet build spectrum/spectrum.csproj -c Release

      - name: Publish spectrum (linux/mac)
        if: matrix.os != 'windows-latest'
        run: |
          dotnet publish spectrum/spectrum.csproj -c Release -r ${{ matrix.os == 'ubuntu-latest' && 'linux-x64' || 'osx-x64' }} -o ./publish --self-contained false

      - name: Publish spectrum (windows)
        if: matrix.os == 'windows-latest'
        run: dotnet publish spectrum/spectrum.csproj -c Release -r win-x64 -o ./publish --self-contained false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-${{ matrix.os }}
          path: ./publish/**
          if-no-files-found: warn
          retention-days: 14
