name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Release APK
        run: dotnet build spectrum.android/spectrum.android.csproj -c Release -f net10.0-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-apk
          path: spectrum.android/bin/Release/net10.0-android/net.retrosystem.spectrum-Signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: spectrum.android/bin/Release/net10.0-android/net.retrosystem.spectrum-Signed.apk
          generate_release_notes: true
